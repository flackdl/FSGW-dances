name: refresh-dance-data

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r crawler/requirements.txt
      - name: Regenerate data
        run: python crawler/crawl.py --refresh
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Refresh dance data"
          title: "Refresh dance data"
          branch: refresh/dance-data
          delete-branch: true
          body: "Automated refresh of data/dances.json, regenerated from fsgw2.org."
